<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Container para alinhar os elementos */
    .container {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
        position: relative;
    }

    /* O Quadrado */
    .quadrado {
        width: 180px;
        height: 100px;
        background-color: #3498db;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px 8px 8px 8px;
        z-index: 2;
        flex-direction: row;
        /* Garante que fica por cima da caixa */
    }

    /* Esconde o checkbox usado para o clique */
    .gatilho {
        display: none;
    }

    /* A caixa de texto oculta e com transição */
    .caixa-texto {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        width: 180px;
        transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.4s ease;
        padding: 0 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
    }

    /* 1. Mudamos para linha (horizontal) */
    .container {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        font-family: sans-serif;
    }

    .quadrado {
        width: 100px;
        height: 100px;
        background-color: #3498db;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 2;
        transition: background-color 0.3s ease, border-radius 0.3s ease;
    }

    .gatilho {
        display: none;
    }

    /* 2. Ajustamos para animar a LARGURA (width) em vez da altura */
    .caixa-texto {
        /* Começa totalmente encolhida na largura */
        height: 200px;
        /* Mesma altura do quadrado para alinhar */
        opacity: 0;
        overflow: hidden;
        background-color: #f1f1f1;
        border-radius: 0 8px 8px 0;
        /* Transição focada no max-width */
        transition: max-width 0.4s ease, opacity 0.3s ease, padding 0.4s ease;
        padding: 15px 0;
        /* Padding vertical inicial */
        box-sizing: border-box;
        white-space: nowrap;
        /* Evita que o texto quebre linhas enquanto abre */
    }

    /* 3. Efeito ao clicar no Quadrado */
    .gatilho:checked+.quadrado {
        background-color: #e74c3c;
        border-radius: 8px 0 0 8px;
        /* Ajusta os cantos para conectar na caixa da direita */
    }

    /* 4. Efeito para abrir a caixa para a direita */
    .gatilho:checked~.caixa-texto {
        max-height: 100px;
        width: auto;
        /* Largura máxima que a caixa vai atingir */
        opacity: 1;
        padding: 15px;
        /* Devolve o padding horizontal */
    }
</style>

<body>
    <div class="container">
        <input type="checkbox" id="toggle" class="gatilho">
        <label for="toggle" class="quadrado">Clique</label>
        <div class="caixa-texto">
            <p>Este texto agora aparece na direita do quadrado!</p>
        </div>
    </div>
</body>

</html>
